<div class="adherent-shell">
  <ng-container *ngIf="vm.loading">
    <div class="adherent-loading">
      <progress class="progress is-large is-info" max="100">60%</progress>
      <p>Chargement en cours</p>
    </div>
  </ng-container>

  <ng-container *ngIf="!vm.loading">
    <section class="adherent-hero">
      <div class="adherent-hero-header">
        <div class="adherent-hero-title">
          <h1 class="title is-5 mb-0">Adhérents</h1>
          <p class="subtitle is-6 mb-0">
            Gestion des adhérents, filtres, édition et suivi de saison
          </p>

          <p class="adherent-refresh-info" *ngIf="vm.lastLoadedAt">
            Dernière mise à jour :
            {{ vm.lastLoadedAt | date : 'dd/MM/yyyy HH:mm:ss' }}
          </p>
        </div>

        <div class="buttons adherent-hero-actions">
         <button
  *ngIf="hasRefreshAvailable"
  class="button is-warning is-light"
  type="button"
  (click)="onApplyRefresh()"
>
            <span class="icon"><i class="fas fa-rotate"></i></span>
            <span>
              <ng-container *ngIf="pendingCountLabel; else refreshDefaultLabel">
                {{ pendingCountLabel }}
              </ng-container>
              <ng-template #refreshDefaultLabel>
                Appliquer les nouveautés
              </ng-template>
            </span>
          </button>

<button
  *ngIf="!isMonCompteContext"
  class="button is-info is-light"
  type="button"
  (click)="onRefreshNow()"
>
            <span class="icon"><i class="fas fa-arrows-rotate"></i></span>
            <span>Rafraîchir</span>
          </button>
        </div>
      </div>
    </section>

    <div class="adherent-content">
     <app-adherent-list
  *ngIf="!vm.editAdherent && canShowAdherentList"
        [vm]="vm"
        (openAdherent)="onOpen($event)"
  [isAdmin]="isAdmin"
        (createAdherent)="onCreate()"
      ></app-adherent-list>

      <app-adherent-editor
        *ngIf="vm.editAdherent"
        [vm]="vm"
  [isAdmin]="isAdmin"(back)="onEditorBack()"
      ></app-adherent-editor>
    </div>
  </ng-container>
</div>
