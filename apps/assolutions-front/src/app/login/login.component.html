<div class="login-wrapper">
  <ng-container *ngIf="loading">
    <div class="login-loading">
      <progress class="progress is-small is-info" max="100">60%</progress>
      <p class="has-text-grey" i18n>Chargement en cours…</p>
    </div>
  </ng-container>

  <ng-container *ngIf="!loading">
    <div class="columns is-centered">
      <div class="column is-11-mobile is-8-tablet is-5-desktop is-4-widescreen">
        <div class="box login-card">
          <!-- HEADER -->
          <header class="login-header has-text-centered">
            <div class="login-logo">
              <span class="icon is-medium">
                <i class="fas fa-user-circle"></i>
              </span>
            </div>
            <h1 class="title is-4 mb-1" i18n>Connexion</h1>
            <p class="subtitle is-6 has-text-grey">
              {{ libelle_titre }}
            </p>

            <p *ngIf="context === 'CREATE' && requestedProject" class="tag is-info is-light mt-2">
              <span i18n>Projet ciblé</span>&nbsp;: {{ requestedProject.nom }}
            </p>
          </header>

          <!-- CORPS DU FORMULAIRE -->
          <section class="login-body">
            <!-- Email -->
            <div class="field">
              <label class="label is-small" for="loginEmail" i18n>Email</label>

              <p *ngIf="!selectedLogin" class="control has-icons-left has-icons-right">
                <input
                  id="loginEmail"
                  [class]="VM.isLoginValid ? 'input' : 'input is-danger'"
                  type="email"
                  placeholder="vous@exemple.fr"
                  i18n-placeholder
                  [(ngModel)]="VM.compte.login"
                  (ngModelChange)="validateLogin()"
                  (input)="validateLogin()"
                  (keypress)="onKeyPress($event)"
                />
                <span class="icon is-small is-left">
                  <i class="fas fa-envelope"></i>
                </span>
                <span *ngIf="VM.isLoginValid" class="icon is-small is-right has-text-success">
                  <i class="fas fa-check"></i>
                </span>
              </p>

              <p
                *ngIf="selectedLogin"
                class="is-flex is-justify-content-space-between is-align-items-center"
              >
                <span>{{ VM.compte.login }}</span>
                <btn
                  [type_button]="'AnnulerSmallLight'"
                  (click)="selectedLogin=false; VM.mdp_requis=false; VM.check_login={ key: false, value: '' }"
                ></btn>
              </p>
            </div>

            <!-- Mot de passe -->
            <div *ngIf="VM.mdp_requis" class="field">
              <label class="label is-small" for="loginPassword" i18n>
                Mot de passe
              </label>

              <p class="control has-icons-left has-icons-right">
                <input
                  id="loginPassword"
                  [class]="VM.isPasswordValid ? 'input' : 'input is-danger'"
                  [type]="showPassword ? 'text' : 'password'"
                  placeholder="••••••••"
                  i18n-placeholder
                  [(ngModel)]="VM.compte.password"
                  (ngModelChange)="validatePassword($event)"
                  (keypress)="onKeyPress($event)"
                />

                <span class="icon is-small is-left">
                  <i class="fas fa-lock"></i>
                </span>

                <span
                  class="icon is-small is-right is-clickable"
                  (click)="togglePassword()"
                  style="cursor:pointer"
                >
                  <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                </span>
              </p>

              <p class="help is-danger" *ngIf="!VM.isPasswordValid" i18n>
                Le mot de passe doit contenir au moins 8 caractères et un nombre.
              </p>
            </div>

            <!-- Sélection projet -->
            <ng-container *ngIf="projets">
              <ng-container *ngIf="projets.length > 1">
                <div class="field">
                  <label for="projet" class="label is-small" i18n>Projet</label>
                  <div class="control">
                    <div class="select is-fullwidth">
                      <select id="projet" [(ngModel)]="projets_select" i18n-placeholder>
                        <option [ngValue]="null" selected i18n>Aucune sélection</option>
                        <ng-container *ngFor="let tt of projets">
                          <option [ngValue]="tt">{{ tt.nom }}</option>
                        </ng-container>
                      </select>
                    </div>
                  </div>

                  <p
                    *ngIf="context === 'CREATE' && requestedProjectId && !projets_select"
                    class="help is-warning"
                    i18n
                  >
                    Le projet du lien n'est pas dans votre liste. Sélectionnez un autre projet accessible.
                  </p>
                </div>
              </ng-container>
            </ng-container>
          </section>

          <!-- BOUTONS D’ACTION -->
          <footer class="login-footer">
            <div class="columns">
              <div class="column">
                <!-- Cas standard (sans projets) -->
                <div class="field" *ngIf="!projets">
                  <p class="control stack-3">
                    <button
                      *ngIf="!store.isLoggedIn() && !VM.mdp_requis"
                      [disabled]="!VM.isValid"
                      class="button is-success is-light btn-mobile btn-elevated btn-lg btn-block-mobile"
                      (click)="Login()"
                      i18n
                    >
                      Se connecter
                    </button>

                    <button
                      *ngIf="VM.mdp_requis && !store.isLoggedIn()"
                      [disabled]="!VM.isValid"
                      class="button is-success is-light btn-mobile btn-elevated btn-lg btn-block-mobile"
                      (click)="Login()"
                      i18n
                    >
                      Valider le mot de passe
                    </button>

                    <button
                      *ngIf="!VM.mdp_requis && context != 'REINIT' && context != 'ESSAI'"
                      type="button"
                      class="button is-text btn-mobile btn-block-mobile"
                      [disabled]="!VM.isLoginValid"
                      (click)="ReinitMDP()"
                      i18n
                    >
                      Réinitialiser le mot de passe
                    </button>

                    <!-- Création uniquement depuis un lien CREATE + projet -->
                    <button
                      *ngIf="canCreateAccount"
                      type="button"
                      class="button is-link is-light btn-mobile btn-elevated btn-lg btn-block-mobile"
                      (click)="goCreateAccount()"
                      i18n
                    >
                      Créer un compte
                    </button>
                  </p>
                </div>

                <!-- Cas avec projets -->
                <div class="field" *ngIf="projets">
                  <p class="control stack-3">
                    <button
                      class="button is-success is-light btn-mobile btn-elevated btn-lg btn-block-mobile"
                      [disabled]="!projets_select"
                      (click)="ConnectToProject()"
                      i18n
                    >
                      Se connecter au projet
                    </button>
                    <button
                      class="button is-danger is-light btn-mobile btn-elevated btn-lg btn-block-mobile"
                      (click)="LogOut()"
                      i18n
                    >
                      Se déconnecter
                    </button>
                  </p>
                </div>
              </div>
            </div>
          </footer>
        </div>
      </div>
    </div>
  </ng-container>
</div>
