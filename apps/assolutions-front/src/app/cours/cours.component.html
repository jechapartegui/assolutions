<div class="cours-shell">
  <ng-container *ngIf="vm.loading">
    <div class="cours-loading">
      <progress class="progress is-large is-info" max="100">60%</progress>
      <p>Chargement en cours</p>
    </div>
  </ng-container>

  <ng-container *ngIf="!vm.loading">
    <section class="cours-hero">
      <div class="cours-hero-header">
        <div class="cours-hero-title">
          <h1 class="title is-5 mb-0">Cours</h1>
          <p class="subtitle is-6 mb-0">
            Gestion des cours, filtres, édition et suivi de saison
          </p>

          <p class="cours-refresh-info" *ngIf="vm.lastLoadedAt">
            Dernière mise à jour :
            {{ vm.lastLoadedAt | date : 'dd/MM/yyyy HH:mm:ss' }}
          </p>
        </div>

        <div class="buttons cours-hero-actions">
          <button
            *ngIf="hasRefreshAvailable"
            class="button is-warning is-light"
            type="button"
            (click)="onApplyRefresh()"
          >
            <span class="icon"><i class="fas fa-rotate"></i></span>
            <span>
              <ng-container *ngIf="pendingCountLabel; else refreshDefaultLabel">
                {{ pendingCountLabel }}
              </ng-container>
              <ng-template #refreshDefaultLabel>
                Appliquer les nouveautés
              </ng-template>
            </span>
          </button>

          <button
            class="button is-info is-light"
            type="button"
            (click)="onRefreshNow()"
          >
            <span class="icon"><i class="fas fa-arrows-rotate"></i></span>
            <span>Rafraîchir</span>
          </button>
        </div>
      </div>
    </section>

    <div class="cours-content">
      <app-cours-list
        *ngIf="!vm.editCours"
        [vm]="vm"
        (openCours)="onOpen($event)"
  [isAdmin]="isAdmin"
        (createCours)="onCreate()"
      ></app-cours-list>

      <app-cours-editor
        *ngIf="vm.editCours"
        [vm]="vm"
  [isAdmin]="isAdmin"
        (back)="onBackToList()"
      ></app-cours-editor>
    </div>
  </ng-container>
</div>
