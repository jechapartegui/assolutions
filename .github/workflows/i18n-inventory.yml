name: Assolutions i18n inventory

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Assemble English catalog
        run: node tools/i18n/build-en-translations.mjs

      - name: Extract current Angular messages
        run: |
          rm -rf /tmp/assolutions-i18n
          mkdir -p /tmp/assolutions-i18n
          npx nx run assolutions-front:extract-i18n --outputPath=/tmp/assolutions-i18n --outFile=messages.xlf --skip-nx-cache

      - name: Verify English catalog coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const xml = fs.readFileSync('/tmp/assolutions-i18n/messages.xlf', 'utf8');
          const english = JSON.parse(fs.readFileSync('apps/assolutions-front/src/locale/messages.en.json', 'utf8')).translations ?? {};
          const units = [...xml.matchAll(/<trans-unit\s+([^>]*\bid="([^"]+)"[^>]*)>([\s\S]*?)<\/trans-unit>/g)];
          const sourceById = new Map();
          for (const [, , id, body] of units) {
            const source = body.match(/<source>([\s\S]*?)<\/source>/)?.[1]?.replace(/\s+/g, ' ').trim() ?? '';
            const previous = sourceById.get(id);
            if (previous && previous !== source) {
              throw new Error(`Conflicting source messages for i18n id ${id}: ${previous} / ${source}`);
            }
            sourceById.set(id, source);
          }
          const missing = [...sourceById.entries()].filter(([id]) => !Object.prototype.hasOwnProperty.call(english, id));
          const empty = [...sourceById.entries()].filter(([id]) => Object.prototype.hasOwnProperty.call(english, id) && !String(english[id] ?? '').trim());
          console.log(`I18N_SOURCE_UNITS=${sourceById.size}`);
          console.log(`I18N_ENGLISH_UNITS=${Object.keys(english).length}`);
          console.log(`I18N_MISSING_ENGLISH=${missing.length}`);
          console.log(`I18N_EMPTY_ENGLISH=${empty.length}`);
          if (missing.length) {
            for (const [id, source] of missing) console.error(`MISSING ${id}: ${source}`);
          }
          if (empty.length) {
            for (const [id, source] of empty) console.error(`EMPTY ${id}: ${source}`);
          }
          if (missing.length || empty.length) process.exit(1);
          NODE

      - name: Check residual template strings
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { HtmlParser } from '@angular/compiler';
          const root = path.resolve('apps/assolutions-front/src/app');
          const parser = new HtmlParser();
          const attributeNames = new Set(['title', 'placeholder', 'aria-label', 'alt']);
          const rows = [];
          function files(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) return files(full);
              return entry.isFile() && entry.name.endsWith('.html') ? [full] : [];
            });
          }
          function literal(value = '') {
            return value.replace(/{{[\s\S]*?}}/g, ' ').replace(/&(?:[a-zA-Z]+|#\d+|#x[0-9a-fA-F]+);/g, ' ').replace(/\s+/g, ' ').trim();
          }
          function meaningful(value) { return /\p{L}/u.test(literal(value)); }
          for (const file of files(root)) {
            const source = fs.readFileSync(file, 'utf8');
            const parsed = parser.parse(source, file, { tokenizeExpansionForms: true });
            if (parsed.errors?.length) continue;
            function visit(node, insideI18n = false) {
              if (!node || typeof node !== 'object' || !(typeof node.name === 'string' && Array.isArray(node.children))) return;
              const attrs = Array.isArray(node.attrs) ? node.attrs : [];
              const names = new Set(attrs.map((attr) => attr.name));
              const ownI18n = names.has('i18n');
              const directText = node.children.some((child) => child?.constructor?.name === 'Text' && meaningful(child.value));
              if (!insideI18n && !ownI18n && directText) rows.push({ file, type: 'text' });
              for (const attr of attrs) {
                if (attributeNames.has(attr.name) && meaningful(attr.value) && !names.has(`i18n-${attr.name}`)) rows.push({ file, type: attr.name });
              }
              for (const child of node.children) visit(child, insideI18n || ownI18n);
            }
            for (const node of parsed.rootNodes) visit(node, false);
          }
          console.log(`UNMARKED_I18N=${rows.length}`);
          if (rows.length) {
            for (const row of rows.slice(0, 100)) console.error(JSON.stringify(row));
            process.exit(1);
          }
          NODE

      - name: Build English frontend explicitly
        run: npx nx build assolutions-front --configuration=development-en --skip-nx-cache
