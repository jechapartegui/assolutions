name: Validate Assolutions

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci

      - name: Repository security guardrails
        run: npm run security:check

      - name: Check maintenance scripts syntax
        run: |
          node --check scripts/anonymize-preprod.cjs
          node --check scripts/security-check.cjs

      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Build backend
        run: npx nx build assolutions-back --configuration=production --skip-nx-cache

      - name: Build frontend preprod
        run: npx nx build assolutions-front --configuration=preprod --skip-nx-cache

      - name: Build frontend production
        run: npx nx build assolutions-front --configuration=production --skip-nx-cache
