name: Persist Assolutions i18n markers

on:
  push:
    branches:
      - correctif-generaux

permissions:
  contents: write

jobs:
  persist:
    if: ${{ !contains(github.event.head_commit.message, '[i18n-marker-commit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correctif-generaux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add missing Angular i18n markers
        run: node tools/i18n/annotate-assolutions-templates.mjs
      - name: Commit markers if needed
        run: |
          if git diff --quiet -- apps/assolutions-front/src/app; then
            echo "No template marker changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/assolutions-front/src/app
          git commit -m "chore(i18n): persist template markers [i18n-marker-commit]"
          git push origin HEAD:correctif-generaux
