name: Apply correctif aout

on:
  push:
    branches: [correction-aout]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correction-aout
          fetch-depth: 0

      - name: Apply patches
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Motif introuvable dans {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          menu_ts = 'apps/assolutions-front/src/app/menu/menu.component.ts'
          replace(menu_ts, '''  async MAJInscription(
    ms: MesSeances_VM,
    rider: AdherentMenu,
    present: boolean | null,
  ): Promise<void> {
  let statut_inscription: InscriptionStatus_VM | null = null;

  if (present === true) {
    statut_inscription = InscriptionStatus_VM.PRESENT;
  } else if (present === false) {
    statut_inscription = InscriptionStatus_VM.ABSENT;
  }

    await this.menuRepository.updateInscription(ms.seance.id, rider.id, statut_inscription);

    

    this.menuStore.patchLocalInscription(rider.id, (ms.seance as Seance_VM).id, statut_inscription);
  }
''', '''  async MAJInscription(
    ms: MesSeances_VM,
    rider: AdherentMenu,
    present: boolean | null,
  ): Promise<void> {
    let statut_inscription: InscriptionStatus_VM | null = null;
    const demandeEssai = present === true && this.isEssaiPossible(ms);

    if (demandeEssai) {
      const confirme = window.confirm(
        `Confirmez-vous la demande de séance d'essai pour ${rider.prenom} ${rider.nom} ?\n\n` +
        `${ms.seance.nom || ms.seance.cours_nom} - ${new Date(ms.seance.date_seance).toLocaleDateString('fr-FR')} à ${ms.seance.heure_debut}`,
      );
      if (!confirme) return;
      statut_inscription = InscriptionStatus_VM.ESSAI;
    } else if (present === true) {
      statut_inscription = InscriptionStatus_VM.PRESENT;
    } else if (present === false) {
      statut_inscription = InscriptionStatus_VM.ABSENT;
    }

    await this.menuRepository.updateInscription(ms.seance.id, rider.id, statut_inscription);
    this.menuStore.patchLocalInscription(rider.id, (ms.seance as Seance_VM).id, statut_inscription);

    if (demandeEssai) {
      await this.sendEssaiConfirmation(ms, rider);
      ErrorService.instance.emitChange(
        ErrorService.instance.OKMessage($localize`Votre demande d'essai est enregistrée.`),
      );
    }
  }

  isEssai(ms: MesSeances_VM): boolean {
    return ms?.statutInscription === InscriptionStatus_VM.ESSAI || ms?.statutInscription === 'essai';
  }

  isEssaiPossible(ms: MesSeances_VM): boolean {
    return !!ms?.seance?.essai_possible && !ms?.statutInscription;
  }

  hasEssaiPossible(rider: AdherentMenu): boolean {
    return rider?.profil === 'ADH' && (rider.MesSeances ?? []).some((ms) => this.isEssaiPossible(ms));
  }

  private async sendEssaiConfirmation(ms: MesSeances_VM, rider: AdherentMenu): Promise<void> {
    const email = this.store.compte()?.login;
    if (!email) return;

    try {
      await this.messageservice.send({
        to: { email, name: `${rider.prenom ?? ''} ${rider.nom ?? ''}`.trim() || email },
        subject: `Confirmation de séance d'essai - ${ms.seance.nom || ms.seance.cours_nom}`,
        html: `<p>Bonjour,</p><p>La demande de séance d'essai pour <strong>${rider.prenom ?? ''} ${rider.nom ?? ''}</strong> est bien enregistrée.</p><p><strong>${ms.seance.nom || ms.seance.cours_nom}</strong><br>${new Date(ms.seance.date_seance).toLocaleDateString('fr-FR')} à ${ms.seance.heure_debut}<br>${ms.seance.lieu_nom ?? ''}</p><p>Le club dispose désormais de cette information dans la feuille de présence.</p>`,
      });
    } catch (error) {
      ErrorService.instance.emitChange(
        ErrorService.instance.CreateError($localize`Envoyer la confirmation d'essai`, error),
      );
    }
  }
''')

          menu_html = 'apps/assolutions-front/src/app/menu/menu.component.html'
          replace(menu_html, '''              <p
                class="rider-role"
                [ngClass]="{
                  'has-text-primary': personne.profil === 'ADH',
                  'has-text-info': personne.profil === 'PROF'
                }"
              >
                {{ getLibelleProfil(personne.profil) }}
              </p>
''', '''              <p
                class="rider-role"
                [ngClass]="{
                  'has-text-primary': personne.profil === 'ADH',
                  'has-text-info': personne.profil === 'PROF'
                }"
              >
                {{ getLibelleProfil(personne.profil) }}
              </p>
              <span *ngIf="hasEssaiPossible(personne)" class="tag is-warning is-light rider-trial-tag">
                <i class="fas fa-flask mr-1"></i> Non inscrit · essais possibles
              </span>
''')

          replace(menu_html, '''                                : {{ ms.seance.cours_nom }}
                              </td>
''', '''                                : {{ ms.seance.cours_nom }}
                                <span *ngIf="isEssaiPossible(ms)" class="tag is-warning is-light trial-status-tag">
                                  <i class="fas fa-flask mr-1"></i> Essai possible
                                </span>
                                <span *ngIf="isEssai(ms)" class="tag is-warning trial-status-tag">
                                  <i class="fas fa-flask mr-1"></i> Essai demandé
                                </span>
                              </td>
''')

          replace(menu_html, '''                                      <span
                                        (click)="MAJInscription(ms, rider, null)"
                                        *ngIf="
                                          ms.statutInscription == 'présent' ||
                                          ms.statutInscription === 'essai'
                                        "
                                        class="icon is-large action-icon"
                                      >
                                        <span class="fa-stack fa-lg">
                                          <i class="fas fa-lg fa-thumbs-up has-text-success"></i>
                                        </span>
                                      </span>
''', '''                                      <span
                                        (click)="MAJInscription(ms, rider, null)"
                                        *ngIf="ms.statutInscription == 'présent'"
                                        class="icon is-large action-icon"
                                        title="Présent"
                                      >
                                        <span class="fa-stack fa-lg">
                                          <i class="fas fa-lg fa-thumbs-up has-text-success"></i>
                                        </span>
                                      </span>

                                      <span
                                        (click)="MAJInscription(ms, rider, null)"
                                        *ngIf="isEssai(ms)"
                                        class="icon is-large action-icon trial-action-icon"
                                        title="Essai demandé"
                                      >
                                        <span class="fa-stack fa-lg">
                                          <i class="fas fa-lg fa-flask has-text-warning"></i>
                                        </span>
                                      </span>

                                      <span
                                        (click)="MAJInscription(ms, rider, true)"
                                        *ngIf="isEssaiPossible(ms)"
                                        class="icon is-large action-icon trial-action-icon"
                                        title="Demander un essai"
                                      >
                                        <span class="fa-stack fa-lg">
                                          <i class="fas fa-lg fa-flask has-text-warning"></i>
                                        </span>
                                      </span>
''')

          replace(menu_html, '''                                          ms.statutInscription == 'convoqué' ||
                                          ms.statutInscription == null
''', '''                                          ms.statutInscription == 'convoqué' ||
                                          (ms.statutInscription == null && !isEssaiPossible(ms))
''')

          replace(menu_html, '''                                      <button
                                        type="button"
                                        class="mobile-action-btn"
                                        (click)="MAJInscription(ms, rider, true)"
                                        *ngIf="
                                          ms.statutInscription == 'absent' ||
                                          ms.statutInscription == 'convoqué' ||
                                          ms.statutInscription == null
                                        "
                                      >
                                        <i class="far fa-thumbs-up has-text-success"></i>
                                      </button>
''', '''                                      <button
                                        type="button"
                                        class="mobile-action-btn trial-action-btn"
                                        (click)="MAJInscription(ms, rider, true)"
                                        *ngIf="isEssaiPossible(ms)"
                                        title="Demander un essai"
                                      >
                                        <i class="fas fa-flask has-text-warning"></i>
                                      </button>

                                      <button
                                        type="button"
                                        class="mobile-action-btn"
                                        (click)="MAJInscription(ms, rider, true)"
                                        *ngIf="
                                          ms.statutInscription == 'absent' ||
                                          ms.statutInscription == 'convoqué' ||
                                          (ms.statutInscription == null && !isEssaiPossible(ms))
                                        "
                                      >
                                        <i class="far fa-thumbs-up has-text-success"></i>
                                      </button>
''')

          replace(menu_html, '''                                      <button
                                        type="button"
                                        class="mobile-action-btn"
                                        (click)="MAJInscription(ms, rider, null)"
                                        *ngIf="
                                          ms.statutInscription == 'présent' ||
                                          ms.statutInscription === 'essai'
                                        "
                                      >
                                        <i class="fas fa-thumbs-up has-text-success"></i>
                                      </button>
''', '''                                      <button
                                        type="button"
                                        class="mobile-action-btn"
                                        (click)="MAJInscription(ms, rider, null)"
                                        *ngIf="ms.statutInscription == 'présent'"
                                      >
                                        <i class="fas fa-thumbs-up has-text-success"></i>
                                      </button>

                                      <button
                                        type="button"
                                        class="mobile-action-btn trial-action-btn"
                                        (click)="MAJInscription(ms, rider, null)"
                                        *ngIf="isEssai(ms)"
                                        title="Essai demandé"
                                      >
                                        <i class="fas fa-flask has-text-warning"></i>
                                      </button>
''')

          replace(menu_html, '''                                      : {{ ms.seance.nom }}
                                    </span>
''', '''                                      : {{ ms.seance.nom }}
                                    </span>
                                    <span *ngIf="isEssaiPossible(ms)" class="tag is-warning is-light trial-status-tag">
                                      <i class="fas fa-flask mr-1"></i> Essai possible
                                    </span>
                                    <span *ngIf="isEssai(ms)" class="tag is-warning trial-status-tag">
                                      <i class="fas fa-flask mr-1"></i> Essai demandé
                                    </span>
''')

          menu_css = Path('apps/assolutions-front/src/app/menu/menu.component.css')
          css = menu_css.read_text(encoding='utf-8')
          css += '''

/* Séances d'essai : distinction explicite desktop et mobile */
.rider-trial-tag {
  margin-top: .25rem;
  white-space: normal;
  text-align: center;
  line-height: 1.15;
}

.trial-status-tag {
  margin-left: .5rem;
  vertical-align: middle;
  font-weight: 700;
}

.trial-action-icon,
.trial-action-btn {
  background: #fff8db !important;
  border: 1px solid #f2c94c !important;
  border-radius: 999px;
}

.mobile-item:has(.trial-status-tag) {
  border-left: 4px solid #f2c94c;
  background: #fffdf3;
}

@media (max-width: 767px) {
  .trial-status-tag {
    display: inline-flex;
    margin: .35rem 0 0;
  }
}
'''
          menu_css.write_text(css, encoding='utf-8')

          ma_ts = 'apps/assolutions-front/src/app/ma-seance/ma-seance.component.ts'
          replace(ma_ts, '''      case "essai":
        return "fa-question";
''', '''      case "essai":
        return "fa-flask has-text-warning";
''')

          ma_html = 'apps/assolutions-front/src/app/ma-seance/ma-seance.component.html'
          replace(ma_html, '''                <span
                  class="tag is-light"
                  *ngIf="potentiel.statut_inscription && !isSeanceStatus"
                >
                  {{ potentiel.statut_inscription }}
                </span>
''', '''                <span
                  class="tag"
                  [ngClass]="potentiel.statut_inscription === 'essai' ? 'is-warning' : 'is-light'"
                  *ngIf="potentiel.statut_inscription && !isSeanceStatus"
                >
                  <i *ngIf="potentiel.statut_inscription === 'essai'" class="fas fa-flask mr-1"></i>
                  {{ potentiel.statut_inscription === 'essai' ? 'Essai' : potentiel.statut_inscription }}
                </span>
''')

          # Retire le workflow temporaire après application.
          Path('.github/workflows/apply-correctif-aout.yml').unlink(missing_ok=True)

      - name: Build
        run: |
          npm ci
          npx nx build assolutions-back --configuration=production
          npx nx build assolutions-front --configuration=preprod

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(essai): distingue et enregistre les séances d'essai" || exit 0
          git push origin correction-aout
