name: Apply correctif aout v3

on:
  push:
    branches: [correction-aout]

permissions:
  contents: write

jobs:
  patch-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correction-aout
          fetch-depth: 0

      - name: Extract and apply existing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-correctif-aout-v2.yml')
          text = workflow.read_text(encoding='utf-8').splitlines()
          script = []
          capture = False
          for line in text:
              if "python - <<'PY'" in line:
                  capture = True
                  continue
              if capture and line.strip() == 'PY':
                  break
              if capture:
                  script.append(line[10:] if line.startswith('          ') else line)

          if not script:
              raise SystemExit('Script de correction introuvable dans le workflow v2')

          patch_file = Path('/tmp/apply_correctif_aout.py')
          patch_file.write_text('\n'.join(script) + '\n', encoding='utf-8')
          exec(compile(patch_file.read_text(encoding='utf-8'), str(patch_file), 'exec'))
          PY

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/apply-correctif-aout.yml
          rm -f .github/workflows/apply-correctif-aout-v2.yml
          rm -f .github/workflows/apply-correctif-aout-v3.yml

      - name: Commit real application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(essai): distingue et enregistre les séances d'essai"
          git push origin correction-aout
