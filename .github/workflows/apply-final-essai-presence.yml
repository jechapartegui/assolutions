name: Apply final essai presence
on:
  push:
    paths:
      - '.github/workflows/apply-final-essai-presence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correction-aout
          fetch-depth: 0
      - name: Appliquer les corrections métier et UI
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Motif introuvable dans {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          # 1) Back : expose un accès normal calculé séance par séance.
          path = 'apps/assolutions-back/src/app/mes_seances/mes_seances.query.service.ts'
          patch(path,
          "  est_adherent: boolean;\n  seance_id: number;",
          "  est_adherent: boolean;\n  acces_inscription: boolean;\n  seance_id: number;")
          patch(path,
          "        pc.est_adherent,\n        s.seance_id,\n        ins.statut_inscription,",
          "        pc.est_adherent,\n        (\n          EXISTS (\n            SELECT 1 FROM seances_par_groupes spg\n            WHERE spg.personne_id = pc.personne_id\n              AND spg.seance_id = s.seance_id\n          )\n          OR EXISTS (\n            SELECT 1 FROM seances_nominatives_inscrites sni\n            WHERE sni.personne_id = pc.personne_id\n              AND sni.seance_id = s.seance_id\n          )\n          OR (\n            ins.statut_inscription IS NOT NULL\n            AND ins.statut_inscription <> 'essai'\n          )\n        ) AS acces_inscription,\n        s.seance_id,\n        ins.statut_inscription,")
          patch(path,
          "        seance: { id: r.seance_id },\n        statutInscription: r.statut_inscription ?? undefined,",
          "        seance: { id: r.seance_id },\n        accesInscription: r.acces_inscription,\n        statutInscription: r.statut_inscription ?? undefined,")

          # 2) Contrats partagés.
          path = 'libs/shared/src/lib/mes-seances.interface.ts'
          patch(path,
          "  statutInscription?: InscriptionStatusDto;\n  statutPrésence?: PresenceStatusDto;",
          "  accesInscription?: boolean;\n  statutInscription?: InscriptionStatusDto;\n  statutPrésence?: PresenceStatusDto;")
          patch(path,
          "  statutInscription: InscriptionStatusDto;\n  statutPrésence: PresenceStatusDto;",
          "  accesInscription?: boolean;\n  statutInscription: InscriptionStatusDto;\n  statutPrésence: PresenceStatusDto;")

          path = 'libs/shared/src/lib/seance.interface.ts'
          patch(path,
          "    statutInscription?: 'présent' | 'absent' | 'convoqué' | 'essai'; // Peut être null -> optionnel\n    statutPrésence?: 'présent' | 'absent';",
          "    accesInscription?: boolean; // accès normal via groupe, convocation ou inscription existante\n    statutInscription?: 'présent' | 'absent' | 'convoqué' | 'essai'; // Peut être null -> optionnel\n    statutPrésence?: 'présent' | 'absent';")

          # 3) Hydratation et mapping front.
          path = 'apps/assolutions-front/src/repository/menu.repository.ts'
          patch(path,
          "              seanceProfesseurs: profsBySeanceId.get(seance.seance_id) ?? [],\n              statutInscription: ms.statutInscription ?? null,",
          "              seanceProfesseurs: profsBySeanceId.get(seance.seance_id) ?? [],\n              accesInscription: ms.accesInscription === true,\n              statutInscription: ms.statutInscription ?? null,")

          path = 'apps/assolutions-front/src/mapper/menu.mapper.ts'
          patch(path,
          "      seance: seanceVm,\n      statutInscription: ms.statutInscription ?? null,",
          "      seance: seanceVm,\n      accesInscription: ms.accesInscription === true,\n      statutInscription: ms.statutInscription ?? null,")

          # 4) Règle front : essai seulement sans accès normal à CETTE séance.
          path = 'apps/assolutions-front/src/app/menu/menu.component.ts'
          patch(path,
          "      rider?.profil === 'ADH' &&\n      rider.inscrit === false &&\n      !!ms?.seance?.essai_possible &&\n      !ms?.statutInscription",
          "      rider?.profil === 'ADH' &&\n      ms?.accesInscription !== true &&\n      !!ms?.seance?.essai_possible &&\n      !ms?.statutInscription")
          patch(path,
          "      rider?.profil === 'ADH' &&\n      rider.inscrit === false &&\n      (rider.MesSeances ?? []).some((ms) => this.isEssaiPossible(ms, rider))",
          "      rider?.profil === 'ADH' &&\n      (rider.MesSeances ?? []).some((ms) => this.isEssaiPossible(ms, rider))")

          # 5) Template : accès présents (jumelles), pas de boutons classiques sur accès essai.
          path = 'apps/assolutions-front/src/app/menu/menu.component.html'
          patch(path,
          "<span *ngIf=\"hasEssaiPossible(personne)\" class=\"rider-trial-hint\" title=\"Non inscrit au club · séances d'essai disponibles\">\n                <i class=\"fas fa-flask\"></i> Essai\n              </span>",
          "<span *ngIf=\"hasEssaiPossible(personne)\" class=\"rider-trial-hint\" title=\"Séances d'essai accessibles\">\n                <i class=\"fas fa-flask\"></i><span>Essai disponible</span>\n              </span>")

          # Jumelles desktop au début de la cellule présence.
          patch(path,
          "                              <td>\n                                <ng-container *ngIf=\"rider.profil == 'PROF'; else ProfilAdherentDesktop\">",
          "                              <td>\n                                <div class=\"presence-actions\">\n                                <button\n                                  *ngIf=\"ms.seance.afficher_present\"\n                                  type=\"button\"\n                                  class=\"presence-view-btn\"\n                                  title=\"Afficher les présents\"\n                                  (click)=\"VoirMaSeance(ms.seance)\"\n                                ><i class=\"fas fa-binoculars\"></i></button>\n                                <ng-container *ngIf=\"rider.profil == 'PROF'; else ProfilAdherentDesktop\">")
          patch(path,
          "                                </ng-template>\n                              </td>",
          "                                </ng-template>\n                                </div>\n                              </td>", 1)

          # N'affiche pas le pouce absent pour une possibilité d'essai non demandée.
          patch(path,
          "                                          ms.statutInscription == 'convoqué' ||\n                                          ms.statutInscription == null ||\n                                          ms.statutInscription == 'essai'",
          "                                          ms.statutInscription == 'convoqué' ||\n                                          (ms.statutInscription == null && !isEssaiPossible(ms, rider)) ||\n                                          ms.statutInscription == 'essai'")

          # Jumelles mobile et exclusion du bouton absent pour essai possible.
          patch(path,
          "                                <div class=\"mobile-item-actions\">\n                                  <ng-container *ngIf=\"rider.profil === 'PROF'; else ProfilAdherentMobile\">",
          "                                <div class=\"mobile-item-actions\">\n                                  <button\n                                    *ngIf=\"ms.seance.afficher_present\"\n                                    type=\"button\"\n                                    class=\"mobile-action-btn presence-view-btn\"\n                                    title=\"Afficher les présents\"\n                                    (click)=\"VoirMaSeance(ms.seance)\"\n                                  ><i class=\"fas fa-binoculars\"></i></button>\n                                  <ng-container *ngIf=\"rider.profil === 'PROF'; else ProfilAdherentMobile\">")
          patch(path,
          "                                          ms.statutInscription == 'essai' ||\n                                          ms.statutInscription == null",
          "                                          ms.statutInscription == 'essai' ||\n                                          (ms.statutInscription == null && !isEssaiPossible(ms, rider))")

          # 6) CSS : pictos alignés et signalétique compacte.
          css = Path('apps/assolutions-front/src/app/menu/menu.component.css')
          text = css.read_text(encoding='utf-8-sig')
          text += r'''

/* Correctif essai / présence : signalétique compacte et alignée */
.rider-trial-hint {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .3rem;
  min-height: 1.35rem;
  margin-top: .15rem;
  padding: .1rem .45rem;
  border-radius: 999px;
  background: #fff7dc;
  color: #725200;
  font-size: .72rem;
  line-height: 1;
  white-space: nowrap;
}

.presence-actions {
  display: inline-flex;
  align-items: center;
  gap: .25rem;
  min-height: 2.5rem;
}

.trial-action-icon,
.presence-view-btn {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  width: 2.35rem;
  height: 2.35rem;
  min-width: 2.35rem;
  padding: 0;
  border-radius: 999px;
  vertical-align: middle;
}

.trial-action-icon {
  border: 1px solid #f1bd32;
  background: #fff9e8;
}

.presence-view-btn {
  border: 1px solid #c8d5e3;
  background: #f7f9fb;
  color: #30475e;
  cursor: pointer;
}

.presence-view-btn:hover {
  background: #edf3f8;
  color: #162a3d;
}

.trial-status-tag {
  display: inline-flex;
  align-items: center;
  gap: .2rem;
  vertical-align: middle;
  line-height: 1;
}

@media (max-width: 1023px) {
  .rider-trial-hint span { display: none; }
  .rider-trial-hint { padding: .2rem .35rem; }
  .mobile-item-actions { align-items: center; }
  .mobile-item-actions .presence-view-btn,
  .mobile-item-actions .trial-action-btn {
    width: 2.15rem;
    height: 2.15rem;
    min-width: 2.15rem;
  }
}
'''
          css.write_text(text, encoding='utf-8')

      - name: Committer les fichiers applicatifs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-final-essai-presence.yml
          git add apps/assolutions-back/src/app/mes_seances/mes_seances.query.service.ts \
                  libs/shared/src/lib/mes-seances.interface.ts \
                  libs/shared/src/lib/seance.interface.ts \
                  apps/assolutions-front/src/repository/menu.repository.ts \
                  apps/assolutions-front/src/mapper/menu.mapper.ts \
                  apps/assolutions-front/src/app/menu/menu.component.ts \
                  apps/assolutions-front/src/app/menu/menu.component.html \
                  apps/assolutions-front/src/app/menu/menu.component.css
          git commit -m "fix(menu): distingue les accès normaux des séances d'essai"
          git push origin correction-aout
