name: Fix essai type
on:
  push:
    branches: [correction-aout]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correction-aout
      - name: Fix TypeScript comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/assolutions-front/src/app/menu/menu.component.ts')
          s = p.read_text(encoding='utf-8')
          old = "return ms?.statutInscription === InscriptionStatus_VM.ESSAI || ms?.statutInscription === 'essai';"
          new = "return ms?.statutInscription === InscriptionStatus_VM.ESSAI;"
          if old not in s:
              raise SystemExit('Motif introuvable')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-essai-type.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(front): corrige le typage du statut essai"
          git push origin correction-aout
