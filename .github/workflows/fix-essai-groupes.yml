name: Fix essai groupes
on:
  push:
    branches: [correction-aout]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correction-aout
          fetch-depth: 0
      - name: Renforcer la règle inscription active
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/assolutions-back/src/app/mes_seances/mes_seances.query.service.ts')
          text = path.read_text(encoding='utf-8')
          old = '''          EXISTS (\n            SELECT 1\n            FROM inscription_saison i\n            WHERE i.personne_id = p.id\n              AND i.saison_id = $2\n              AND i.active = true\n          ) AS est_adherent'''
          new = '''          EXISTS (\n            SELECT 1\n            FROM inscription_saison i\n            JOIN lien_groupe lg_inscription\n              ON lg_inscription.object_type = 'rider'\n             AND lg_inscription.object_id = p.id\n            JOIN groupes g_inscription\n              ON g_inscription.id = lg_inscription.groupe_id\n             AND g_inscription.saison_id = i.saison_id\n            WHERE i.personne_id = p.id\n              AND i.saison_id = $2\n              AND i.active = true\n          ) AS est_adherent'''
          if old not in text:
              raise SystemExit('Bloc est_adherent introuvable')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-essai-groupes.yml').unlink(missing_ok=True)
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(essai): vérifie inscription active et groupe de saison"
          git push origin correction-aout
