name: Fix essai UI
on:
  push:
    branches: [correction-aout]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correction-aout
      - name: Patch
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Motif absent dans {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          ts = 'apps/assolutions-front/src/app/menu/menu.component.ts'
          rep(ts,
              "return rider?.profil === 'ADH' && (rider.MesSeances ?? []).some((ms) => this.isEssaiPossible(ms));",
              "return rider?.profil === 'ADH' && rider.inscrit === false && (rider.MesSeances ?? []).some((ms) => this.isEssaiPossible(ms));")

          html = 'apps/assolutions-front/src/app/menu/menu.component.html'
          rep(html,
              '''              <span *ngIf="hasEssaiPossible(personne)" class="tag is-warning is-light rider-trial-tag">\n                <i class="fas fa-flask mr-1"></i> Non inscrit · essais possibles\n              </span>''',
              '''              <span *ngIf="hasEssaiPossible(personne)" class="rider-trial-hint" title="Non inscrit au club · séances d'essai disponibles">\n                <i class="fas fa-flask"></i> Essai\n              </span>''')

          rep(html,
              '''                                <span *ngIf="isEssaiPossible(ms)" class="tag is-warning is-light trial-status-tag"><i class="fas fa-flask mr-1"></i> Essai possible</span>\n''',
              '', 1)

          rep(html,
              '''                                          ms.statutInscription == 'convoqué' ||\n                                          ms.statutInscription == null\n''',
              '''                                          ms.statutInscription == 'convoqué' ||\n                                          (ms.statutInscription == null && !isEssaiPossible(ms))\n''', 1)

          css = Path('apps/assolutions-front/src/app/menu/menu.component.css')
          s = css.read_text(encoding='utf-8')
          s += '''\n\n/* Ajustements visuels des séances d'essai */\n.rider-trial-hint {\n  display: inline-flex;\n  align-items: center;\n  gap: .3rem;\n  margin-top: .15rem;\n  color: #8a5a00;\n  font-size: .72rem;\n  font-weight: 700;\n}\n\n.desktop-view .trial-status-tag {\n  margin-left: .35rem;\n  padding: .1rem .4rem;\n  font-size: .72rem;\n}\n\n@media (min-width: 768px) {\n  .desktop-view .trial-status-tag.is-light {\n    display: none;\n  }\n}\n'''
          css.write_text(s, encoding='utf-8')

          Path('.github/workflows/fix-essai-ui.yml').unlink(missing_ok=True)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): affine l'affichage des séances d'essai"
          git push origin correction-aout
